[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ubaid Ur Rehman Arshad", email = "ubaidrahmanarshad@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.3",
    "fastembed>=0.7.4",
    "google-genai>=3.3.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "qdrant-client>=1.20.0",
]

[tool.uv]
# onnxruntime dropped Intel-macOS wheels after 1.23.2 (needed by fastembed)
constraint-dependencies = [
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
